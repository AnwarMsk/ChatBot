<div class="flex flex-col h-screen bg-emi-gray relative overflow-hidden font-sans">
  <!-- Gradient Background Enhancers for Premium Feel -->
  <div
    class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-emi-accent rounded-full mix-blend-multiply filter blur-[100px] opacity-30">
  </div>
  <div
    class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-emi-blue rounded-full mix-blend-multiply filter blur-[100px] opacity-30">
  </div>

  <!-- Header -->
  <header
    class="z-10 bg-emi-glass backdrop-blur-md border-b border-white/20 shadow-sm p-4 sticky top-0 flex justify-between items-center px-6">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-emi-blue flex items-center justify-center text-white font-bold shadow-md">
        EMI
      </div>
      <div>
        <h1 class="text-xl font-bold text-emi-dark leading-tight">Chatbot Universitaire</h1>
        <p class="text-xs text-emi-accent font-medium">En ligne</p>
      </div>
    </div>
    <a routerLink="/admin/login"
      class="text-sm font-medium text-gray-500 hover:text-emi-accent transition-colors">Espace Admin</a>
  </header>

  <!-- Chat Container -->
  <div class="flex-1 w-full max-w-4xl mx-auto p-4 sm:p-6 overflow-hidden flex flex-col z-10">

    <!-- Messages View -->
    <div #scrollMe
      class="flex-1 overflow-y-auto w-full h-full pr-2 space-y-5 scrollbar-thin scrollbar-thumb-emi-accent/30 scrollbar-track-transparent">

      <div *ngFor="let msg of messages" class="flex w-full"
        [ngClass]="msg.sender === 'STUDENT' ? 'justify-end' : 'justify-start'">

        <!-- Bot Avatar -->
        <div *ngIf="msg.sender === 'BOT'"
          class="w-8 h-8 rounded-full bg-emi-blue flex-shrink-0 flex items-center justify-center text-white text-xs font-bold mr-3 mt-auto shadow-sm">
          B</div>

        <!-- Message Bubble -->
        <div class="max-w-[80%] rounded-2xl p-4 shadow-sm backdrop-blur-md" [ngClass]="msg.sender === 'STUDENT' 
              ? 'bg-emi-accent text-white rounded-br-none' 
              : 'bg-white/80 border border-white/50 text-emi-dark rounded-bl-none'">
          <p class="text-[15px] leading-relaxed whitespace-pre-wrap">{{ msg.text }}</p>
          <span class="text-[10px] mt-2 block opacity-70 text-right"
            [ngClass]="msg.sender === 'STUDENT' ? 'text-blue-100' : 'text-gray-500'">
            {{ msg.timestamp | date:'shortTime' }}
          </span>
        </div>
      </div>

      <!-- Typing Indicator -->
      <div *ngIf="isTyping" class="flex w-full justify-start items-end">
        <div
          class="w-8 h-8 rounded-full bg-emi-blue flex-shrink-0 flex items-center justify-center text-white text-xs font-bold mr-3 mt-auto shadow-sm">
          B</div>
        <div
          class="bg-white/80 border border-white/50 rounded-2xl rounded-bl-none p-4 shadow-sm backdrop-blur-md flex space-x-1 w-16 h-[52px] items-center justify-center">
          <div class="w-2 h-2 bg-emi-blue rounded-full animate-bounce" style="animation-delay: 0ms"></div>
          <div class="w-2 h-2 bg-emi-blue rounded-full animate-bounce" style="animation-delay: 150ms"></div>
          <div class="w-2 h-2 bg-emi-blue rounded-full animate-bounce" style="animation-delay: 300ms"></div>
        </div>
      </div>

    </div>

    <!-- Input Area -->
    <div class="mt-4 pt-4">
      <div
        class="relative bg-white/70 backdrop-blur-xl border border-white/40 rounded-full shadow-lg p-2 flex items-center transition-all focus-within:bg-white focus-within:shadow-xl focus-within:border-emi-accent/40">
        <input #messageInput type="text" [(ngModel)]="newMessageText" (keyup.enter)="sendMessage()"
          placeholder="Posez votre question à l'EMI (ex: Horaire bibli...)"
          class="flex-1 bg-transparent border-none outline-none px-4 text-emi-dark placeholder-gray-400 font-medium"
          autofocus>

        <button (click)="sendMessage()" [disabled]="!newMessageText.trim() || isTyping"
          class="ml-2 w-10 h-10 rounded-full bg-emi-accent text-white flex items-center justify-center transition-transform transform hover:scale-105 disabled:opacity-50 disabled:hover:scale-100 shadow-md">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-1" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
              d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
          </svg>
        </button>
      </div>
      <p class="text-center text-xs text-black mt-3">Mocké avec un delay RxJS de 1.5s - Créé Par Jihad, Elias, Anwar
        Et Yasser</p>
    </div>
  </div>
</div>
